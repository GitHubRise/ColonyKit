name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (rebuild, warnings are errors)
        shell: pwsh
        run: ./build.ps1

      - name: Verify
        shell: pwsh
        run: ./verify.ps1

      - name: Package
        shell: pwsh
        run: ./package.ps1 -SkipBuild
